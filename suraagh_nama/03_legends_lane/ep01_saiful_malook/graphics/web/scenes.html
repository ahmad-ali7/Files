<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Nastaliq;src:url(fonts/Nastaliq400.ttf);font-weight:400}
@font-face{font-family:Nastaliq;src:url(fonts/Nastaliq700.ttf);font-weight:700}
@font-face{font-family:Fell;src:url(fonts/Fell.ttf)}
@font-face{font-family:Elite;src:url(fonts/Elite.ttf)}
@font-face{font-family:Amiri;src:url(fonts/Amiri.ttf)}
@font-face{font-family:Bengali;src:url(fonts/Bengali.ttf)}
@font-face{font-family:Inter;src:url(fonts/Inter400.ttf);font-weight:400}
@font-face{font-family:Inter;src:url(fonts/Inter600.ttf);font-weight:600}
:root{--night:#0A0F24;--indigo:#18204A;--moon:#E9EDF7;--amber:#F4B35E;--gold:#D9A441;--goldL:#F1D08A;--teal:#123F4A;--paper:#E8DBBE;--ink:#2A2016;--blood:#B5452F;--mute:#8E97B8}
html,body{margin:0;padding:0;background:#000}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;color:var(--moon);background:var(--night)}
.abs{position:absolute}
.ur{font-family:Nastaliq,serif;direction:rtl;font-weight:700;line-height:2}
.en{font-family:Inter,sans-serif;letter-spacing:.22em;text-transform:uppercase;font-weight:600}
.fell{font-family:Fell,serif}
.elite{font-family:Elite,monospace}
.center{left:0;right:0;text-align:center}
.glow{text-shadow:0 0 24px rgba(244,179,94,.45),0 4px 18px rgba(0,0,0,.9)}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 50%,rgba(0,0,0,.6) 100%)}
#grain{position:absolute;inset:-40px;pointer-events:none;opacity:.06;mix-blend-mode:screen}
</style></head>
<body><div id="stage"></div>
<script src="img/topojson.js"></script>
<script>
const S=document.getElementById('stage'),W=1920,H=1080;
const clamp=x=>Math.max(0,Math.min(1,x)),p=(t,a,b)=>clamp((t-a)/(b-a)),eo=x=>1-Math.pow(1-x,3),eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
function E(tag,cls,css,html,parent){const e=document.createElement(tag);if(cls)e.className=cls;if(css)e.style.cssText=css;if(html!=null)e.innerHTML=html;(parent||S).appendChild(e);return e;}
function cv(){const c=E('canvas','abs','left:0;top:0');c.width=W;c.height=H;return c;}
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
function n1(seed){const r=rng(seed),P=[];for(let i=0;i<256;i++)P.push(r());return x=>{const i=Math.floor(x),f=x-i,a=P[i&255],b=P[(i+1)&255],u=f*f*(3-2*f);return a+(b-a)*u;};}
function fade(el,t,a,b,c,d,dy){let o=eo(p(t,a,b));if(c!=null)o*=1-p(t,c,d);el.style.opacity=o;if(dy)el.style.transform=`translateY(${(1-eo(p(t,a,b)))*dy}px)`;}
let grainCv=null;
function fx(){const c=document.createElement('canvas');c.width=1000;c.height=580;c.id='grain';c.style.width='2000px';c.style.height='1160px';const g=c.getContext('2d'),im=g.createImageData(1000,580),r=rng(7);for(let i=0;i<im.data.length;i+=4){const v=r()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255;}g.putImageData(im,0,0);S.appendChild(c);grainCv=c;E('div',null,null,null).id='vig';}
function grain(t){if(grainCv){const k=Math.floor(t*24);grainCv.style.transform=`translate(${(k*37)%40-20}px,${(k*53)%40-20}px)`;}}

// ---------- painterly helpers ----------
function sky(g,top,bot,moon){const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,top);gr.addColorStop(1,bot);g.fillStyle=gr;g.fillRect(0,0,W,H);
  const r=rng(11);for(let i=0;i<420;i++){const x=r()*W,y=r()*H*.6,s=r()*1.6+.2;g.fillStyle=`rgba(233,237,247,${.15+r()*.6})`;g.fillRect(x,y,s,s);}
  if(moon){const [mx,my,mr]=moon;const hal=g.createRadialGradient(mx,my,mr*.8,mx,my,mr*7);hal.addColorStop(0,'rgba(233,237,247,.35)');hal.addColorStop(1,'rgba(233,237,247,0)');g.fillStyle=hal;g.fillRect(0,0,W,H);g.fillStyle='#EEF1F8';g.beginPath();g.arc(mx,my,mr,0,7);g.fill();g.fillStyle='rgba(180,188,210,.35)';g.beginPath();g.arc(mx-mr*.3,my-mr*.2,mr*.22,0,7);g.arc(mx+mr*.25,my+mr*.3,mr*.15,0,7);g.fill();}}
function ridgePts(seed,base,amp,scale,sharp,peaks){const n=n1(seed),pts=[];for(let x=-10;x<=W+10;x+=4){let y=0,a=1,s=scale;for(let o=0;o<6;o++){let v=n(x/s+o*17.3);if(sharp)v=1-Math.abs(v*2-1);y+=v*a;a*=.5;s*=.5;}y=base-y*amp;if(peaks)for(const [px,ph,pw] of peaks){y-=ph*Math.exp(-Math.pow((x-px)/pw,2));}pts.push([x,y]);}return pts;}
function fillRidge(g,pts,fill,rim,rimW){g.beginPath();g.moveTo(pts[0][0],H);for(const [x,y] of pts)g.lineTo(x,y);g.lineTo(pts[pts.length-1][0],H);g.closePath();g.fillStyle=fill;g.fill();if(rim){g.beginPath();pts.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.strokeStyle=rim;g.lineWidth=rimW||2;g.stroke();}}
function snowCaps(g,pts,line,col){g.save();g.beginPath();g.moveTo(pts[0][0],H);for(const [x,y] of pts)g.lineTo(x,y);g.lineTo(W,H);g.closePath();g.clip();const n=n1(99);for(let i=1;i<pts.length;i++){const [x,y]=pts[i];if(y<line){const d=(line-y)*.55+n(x/40)*14;g.fillStyle=col;g.fillRect(x,y,4,d);}}g.restore();}
function valleyScene(g,o){ // shared night valley with lake
  o=o||{};sky(g,o.top||'#060A1C',o.bot||'#1B2550',o.moon===false?null:[1430,230,46]);
  fillRidge(g,ridgePts(3,560,260,700,true,[[1180,170,160]]),'#2A3366','rgba(233,237,247,.25)',1.5);
  snowCaps(g,ridgePts(3,560,260,700,true,[[1180,170,160]]),470,'rgba(225,232,248,.55)');
  fillRidge(g,ridgePts(8,700,200,520,true,[[420,90,180]]),'#1A2150','rgba(241,208,138,.35)',2);
  // lake
  const lg=g.createLinearGradient(0,690,0,820);lg.addColorStop(0,'#2B4A7A');lg.addColorStop(1,'#0B1734');g.fillStyle=lg;g.beginPath();g.ellipse(980,760,560,62,0,0,7);g.fill();
  g.save();g.beginPath();g.ellipse(980,760,560,62,0,0,7);g.clip();g.fillStyle='rgba(238,241,248,.55)';for(let i=0;i<9;i++){g.globalAlpha=.5-i*.05;g.fillRect(1395+Math.sin(i*1.7)*16,712+i*9,70-i*6,2.2);}g.globalAlpha=1;g.restore();
  fillRidge(g,ridgePts(21,860,120,380,false),'#0B0F26','rgba(241,208,138,.28)',2);
  fillRidge(g,ridgePts(33,990,90,260,false),'#04060F');}
function frameOrn(parent,inset,col){const s=E('div','abs',`left:${inset}px;top:${inset}px;right:${inset}px;bottom:${inset}px;border:2px solid ${col};outline:1px solid ${col};outline-offset:10px;opacity:.85`,null,parent);
  for(const [x,y] of [[0,0],[1,0],[0,1],[1,1]]){const d=E('div','abs',`width:46px;height:46px;${x?'right':'left'}:-24px;${y?'bottom':'top'}:-24px;transform:rotate(45deg);border:2px solid ${col};background:rgba(10,15,36,.9)`,null,s);E('div','abs',`left:15px;top:15px;width:12px;height:12px;background:${col}`,null,d);}return s;}

const SCENES={
// 1 — the dastango's bowl and lamp
SM01_bowl_lamp:{dur:8,init(){const c=cv();this.g=c.getContext('2d');fx();},frame(t){const g=this.g;
  const bg=g.createRadialGradient(960,620,40,960,620,1100);bg.addColorStop(0,'#1d1a2a');bg.addColorStop(1,'#03040a');g.fillStyle=bg;g.fillRect(0,0,W,H);
  // white cloth (chandni)
  const cl=g.createLinearGradient(0,640,0,H);cl.addColorStop(0,'#3a3a44');cl.addColorStop(1,'#d9d6cc');g.fillStyle=cl;g.beginPath();g.moveTo(0,700);g.bezierCurveTo(600,660,1300,660,W,700);g.lineTo(W,H);g.lineTo(0,H);g.fill();
  // lamp (diya)
  const fl=1+Math.sin(t*9)*.05+Math.sin(t*23)*.03,lx=560,ly=760;
  let gl=g.createRadialGradient(lx,ly-70,5,lx,ly-70,520*fl);gl.addColorStop(0,'rgba(244,179,94,.55)');gl.addColorStop(.35,'rgba(244,140,60,.18)');gl.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gl;g.fillRect(0,0,W,H);
  g.fillStyle='#6b3b1c';g.beginPath();g.ellipse(lx,ly,95,32,0,0,Math.PI);g.fill();g.fillStyle='#8a4d24';g.beginPath();g.ellipse(lx,ly,95,20,0,0,7);g.fill();g.fillStyle='#2a1508';g.beginPath();g.ellipse(lx,ly,78,13,0,0,7);g.fill();
  g.save();g.translate(lx+52,ly-14);g.scale(1,fl);const fg=g.createRadialGradient(0,-30,2,0,-30,48);fg.addColorStop(0,'#fff6d8');fg.addColorStop(.4,'#ffc35a');fg.addColorStop(1,'rgba(255,120,30,0)');g.fillStyle=fg;g.beginPath();g.moveTo(0,0);g.bezierCurveTo(-22,-20,-10,-60,0,-86);g.bezierCurveTo(10,-60,22,-20,0,0);g.fill();g.restore();
  // silver bowl
  const bx=1080,by=770;g.fillStyle='rgba(0,0,0,.45)';g.beginPath();g.ellipse(bx+20,by+92,300,40,0,0,7);g.fill();
  const bb=g.createLinearGradient(bx-280,0,bx+280,0);bb.addColorStop(0,'#5d6270');bb.addColorStop(.3,'#e6e9f0');bb.addColorStop(.55,'#8e94a3');bb.addColorStop(.8,'#f4d9a6');bb.addColorStop(1,'#4b505c');g.fillStyle=bb;g.beginPath();g.moveTo(bx-280,by);g.bezierCurveTo(bx-260,by+120,bx+260,by+120,bx+280,by);g.fill();
  g.fillStyle='#c9ced9';g.beginPath();g.ellipse(bx,by,280,58,0,0,7);g.fill();
  const wg=g.createRadialGradient(bx+60,by-6,10,bx,by,270);wg.addColorStop(0,'#2f5c86');wg.addColorStop(1,'#0a1630');g.fillStyle=wg;g.beginPath();g.ellipse(bx,by+3,262,48,0,0,7);g.fill();
  // moon & lamp reflection + ripples
  g.save();g.beginPath();g.ellipse(bx,by+3,262,48,0,0,7);g.clip();g.fillStyle='rgba(238,241,248,.85)';g.beginPath();g.ellipse(bx+70,by-6,26,6,0,0,7);g.fill();g.fillStyle='rgba(244,179,94,.5)';g.beginPath();g.ellipse(bx-150,by+10,30,5,0,0,7);g.fill();
  for(let i=0;i<5;i++){const k=((t*.35+i/5)%1);g.strokeStyle=`rgba(233,237,247,${.35*(1-k)})`;g.lineWidth=2;g.beginPath();g.ellipse(bx+20,by+4,30+k*240,6+k*42,0,0,7);g.stroke();}g.restore();
  g.strokeStyle='rgba(255,255,255,.6)';g.lineWidth=3;g.beginPath();g.ellipse(bx,by,280,58,0,Math.PI*1.05,Math.PI*1.6);g.stroke();
  grain(t);}},

// 2 — title
SM02_title:{dur:7,init(){const c=cv();this.g=c.getContext('2d');valleyScene(this.g);this.g.fillStyle='rgba(5,7,18,.45)';this.g.fillRect(0,0,W,H);
  const box=E('div','abs',`left:330px;top:150px;width:1260px;height:620px`);frameOrn(box,0,'rgba(217,164,65,.8)');
  this.a=E('div','abs center ur',`top:200px;font-size:40px;color:var(--goldL)`,'سراغ نامہ پیش کرتا ہے');
  this.b=E('div','abs center ur glow',`top:270px;font-size:190px;color:#F6E3B0;line-height:1.6`,'سیف الملوک');
  this.c=E('div','abs center ur',`top:540px;font-size:58px;color:var(--moon)`,'ایک پری، ایک دیو… اور ڈوبتا ہوا ناران');
  this.d=E('div','abs center en',`top:700px;font-size:20px;color:var(--mute)`,'SAIFUL MALOOK &nbsp;·&nbsp; A DASTAN, AND ITS SURAAGH');fx();},
  frame(t){fade(this.a,t,.3,1.2);fade(this.b,t,.8,2.2,null,null,30);fade(this.c,t,1.8,3);fade(this.d,t,2.4,3.4);grain(t);}},

// 3 — sitting card
SM03_sitting:{dur:4,init(){const bg=E('div','abs',`inset:0;background:radial-gradient(ellipse at 50% 50%,#1a2150 0%,#070a1a 70%)`);
  const box=E('div','abs',`left:610px;top:330px;width:700px;height:420px`);frameOrn(box,0,'rgba(217,164,65,.85)');
  this.a=E('div','abs center ur glow',`top:350px;font-size:120px;color:#F6E3B0;line-height:1.7`,'پہلی نشست');
  this.b=E('div','abs center ur',`top:590px;font-size:46px;color:var(--moon)`,'ایک سچی رات');
  this.c=E('div','abs center en',`top:705px;font-size:18px;color:var(--mute)`,'SITTING I');fx();},
  frame(t){fade(this.a,t,.2,1,3.2,3.9,20);fade(this.b,t,.7,1.4,3.2,3.9);fade(this.c,t,1,1.6,3.2,3.9);grain(t);}},

// 4 — dastan: fairies descend to the river below the lake
SM04_fairies:{dur:10,init(){const c=cv();this.g=c.getContext('2d');const bgc=document.createElement('canvas');bgc.width=W;bgc.height=H;valleyScene(bgc.getContext('2d'));this.bg=bgc;
  const r=rng(5);this.f=[];for(let i=0;i<360;i++)this.f.push({d:r()*1.4,o:(r()-.5)*90,s:r()*.6+.7,w:r()*6});
  // river path from lake outflow (right) winding down-left to foreground
  this.river=[[1460,780],[1500,830],[1420,880],[1300,915],[1160,960],[1040,1010],[960,1090]];fx();},
  frame(t){const g=this.g;g.drawImage(this.bg,0,0);
  // river
  g.save();g.lineCap='round';g.lineJoin='round';g.strokeStyle='rgba(60,100,160,.9)';g.lineWidth=26;g.beginPath();this.river.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.stroke();g.strokeStyle='rgba(200,215,240,.35)';g.lineWidth=4;g.stroke();g.restore();
  // stream of lights from sky (top-left) curving down to the river
  const P0=[260,120],P1=[760,20],P2=[1620,520],P3=[1330,905];const bz=(u)=>{const a=1-u;return[a*a*a*P0[0]+3*a*a*u*P1[0]+3*a*u*u*P2[0]+u*u*u*P3[0],a*a*a*P0[1]+3*a*a*u*P1[1]+3*a*u*u*P2[1]+u*u*u*P3[1]]};
  g.globalCompositeOperation='lighter';
  for(const q of this.f){let u=(t*.16-q.d);if(u<0)continue;u=Math.min(u,1);const [x,y]=bz(u);const sway=Math.sin(t*2+q.w)*10*(1-u);const xx=x+q.o*(1-u*.7)+sway,yy=y+q.o*.4*(1-u);const a=u>=1?.55+.3*Math.sin(t*3+q.w):.9;
    const rg=g.createRadialGradient(xx,yy,0,xx,yy,16*q.s);rg.addColorStop(0,`rgba(255,244,214,${a})`);rg.addColorStop(.3,`rgba(244,200,120,${a*.45})`);rg.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=rg;g.fillRect(xx-20,yy-20,40,40);}
  g.globalCompositeOperation='source-over';
  // clothes on a rock + tiny prince silhouette
  g.fillStyle='#05070f';g.beginPath();g.ellipse(1520,948,70,26,0,0,7);g.fill();
  g.fillStyle='rgba(246,240,225,.9)';g.beginPath();g.moveTo(1470,930);g.quadraticCurveTo(1520,905,1570,928);g.quadraticCurveTo(1530,944,1470,930);g.fill();
  g.fillStyle='#020309';g.beginPath();g.ellipse(1700,935,9,10,0,0,7);g.fill();g.beginPath();g.moveTo(1688,945);g.lineTo(1712,945);g.lineTo(1722,1010);g.lineTo(1678,1010);g.fill();
  grain(t);}},

// 5 — 1907 gazetteer quote card
SM05_gazetteer:{dur:7,init(){E('div','abs',`inset:0;background:radial-gradient(ellipse at 30% 40%,#2b2115 0%,#0a0805 70%)`);
  const card=E('div','abs',`left:300px;top:150px;width:1320px;height:700px;background:var(--paper);box-shadow:0 40px 90px rgba(0,0,0,.7);transform:rotate(-1.2deg)`);
  const tex=document.createElement('canvas');tex.width=1320;tex.height=700;tex.style.cssText='position:absolute;inset:0';card.appendChild(tex);const tg=tex.getContext('2d'),r=rng(3);for(let i=0;i<9000;i++){tg.fillStyle=`rgba(120,90,50,${r()*.07})`;tg.fillRect(r()*1320,r()*700,r()*3,r()*3);}const eg=tg.createRadialGradient(660,350,250,660,350,800);eg.addColorStop(0,'rgba(0,0,0,0)');eg.addColorStop(1,'rgba(110,70,25,.45)');tg.fillStyle=eg;tg.fillRect(0,0,1320,700);
  this.h=E('div','abs elite',`left:80px;top:60px;font-size:26px;color:#5b4630;letter-spacing:.06em`,'GAZETTEER OF THE HAZARA DISTRICT · 1907 · p. 205',card);
  E('div','abs',`left:80px;top:110px;width:1160px;height:2px;background:#6b553a;opacity:.6`,null,card);
  this.q=E('div','abs fell',`left:80px;top:160px;width:1160px;font-size:64px;line-height:1.35;color:var(--ink)`,'“…It is an <span style="background:linear-gradient(transparent 60%,rgba(181,69,47,.35) 60%)">enchanted lake</span>, and of it the following story is told…”',card);
  this.u=E('div','abs ur',`right:80px;top:420px;font-size:64px;color:#3a2a1a;line-height:1.8`,'"یہ ایک طلسمی جھیل ہے…"',card);
  this.s=E('div','abs elite',`left:80px;bottom:50px;font-size:20px;color:#6b553a`,'Source: archive.org · in.ernet.dli.2015.31463 · public domain',card);fx();},
  frame(t){fade(this.h,t,.3,1);fade(this.q,t,.8,2,null,null,20);fade(this.u,t,2,3);fade(this.s,t,2.6,3.4);grain(t);}},

// 6 — the journey map
SM06_journey:{dur:14,async init(){const c=cv();this.g=c.getContext('2d');const land=topojson.feature(await (await fetch('img/land.json')).json(),(await (await fetch('img/land.json')).json()).objects.land);
  this.lon0=24;this.lon1=100;this.lat0=4;this.lat1=44;const sx=W/(this.lon1-this.lon0);this.k=sx;this.P=(lat,lon)=>[(lon-this.lon0)*sx, (this.lat1-lat)*sx+ (H-(this.lat1-this.lat0)*sx)/2];
  const bg=document.createElement('canvas');bg.width=W;bg.height=H;const b=bg.getContext('2d');const oc=b.createRadialGradient(960,540,100,960,540,1200);oc.addColorStop(0,'#0f1636');oc.addColorStop(1,'#04060f');b.fillStyle=oc;b.fillRect(0,0,W,H);
  b.beginPath();for(const f of land.features){const polys=f.geometry.type==='Polygon'?[f.geometry.coordinates]:f.geometry.coordinates;for(const poly of polys)for(const ring of poly){ring.forEach(([lo,la],i)=>{const [x,y]=this.P(la,lo);i?b.lineTo(x,y):b.moveTo(x,y);});b.closePath();}}
  b.fillStyle='#1d2552';b.fill();b.strokeStyle='rgba(217,164,65,.55)';b.lineWidth=1.4;b.stroke();this.bg=bg;
  this.stops=[{lat:30.04,lon:31.24,ur:'الف لیلہ',sc:'<span style="font-family:Amiri">ألف ليلة وليلة</span>',y:'عربی',dx:-40,dy:60},
    {lat:32.65,lon:51.67,ur:'فارسی داستان',sc:'<span style="font-family:Amiri">حکایت سیف‌الملوک</span>',y:'نسخہ 1625',dx:0,dy:-150},
    {lat:17.38,lon:78.40,ur:'ملا غواصی · گولکنڈہ',sc:'دکنی اُردو',y:'1035ھ',dx:-330,dy:30},
    {lat:20.59,lon:93.19,ur:'سید علاؤل · آراکان',sc:'<span style="font-family:Bengali">সয়ফুলমুলুক বদিউজ্জামাল</span>',y:'1669',dx:-200,dy:60},
