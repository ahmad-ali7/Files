<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}#stage{width:1920px;height:1080px;position:relative}canvas{display:block}</style></head>
<body><div id="stage"></div>
<script src="three.min.js"></script><script src="terrain.js"></script>
<script>
const dec=s=>{const b=Uint8Array.from(atob(s),c=>c.charCodeAt(0));return new Float32Array(b.buffer)};
const W=T.w,Hh=T.h,M=T.mpp,E=dec(T.E),HAND=dec(T.HAND),AL=dec(T.AL),D=dec(T.D),LK=dec(T.LK),L0=T.lake;
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(1920,1080);renderer.setPixelRatio(1);
document.getElementById('stage').appendChild(renderer.domElement);
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(38,1920/1080,10,60000);
// terrain
const geo=new THREE.PlaneGeometry((W-1)*M,(Hh-1)*M,W-1,Hh-1);geo.rotateX(-Math.PI/2);
const pos=geo.attributes.position;
const ES=new Float32Array(E.length);for(let r=0;r<Hh;r++)for(let c=0;c<W;c++){let s=0,n=0;for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++){const rr=r+dr,cc=c+dc;if(rr>=0&&rr<Hh&&cc>=0&&cc<W){s+=E[rr*W+cc];n++;}}ES[r*W+c]=s/n;}
for(let i=0;i<pos.count;i++){pos.setY(i,ES[i]-L0);} geo.computeVertexNormals();
const tex=new THREE.TextureLoader().load('sat.jpg');tex.anisotropy=8;
const U={sat:{value:tex},moonDir:{value:new THREE.Vector3(-.35,.55,-.75).normalize()},fogC:{value:new THREE.Color(0x0b1326)},camP:{value:new THREE.Vector3()},flash:{value:0}};
const terr=new THREE.Mesh(geo,new THREE.ShaderMaterial({uniforms:U,
vertexShader:`varying vec2 vUv;varying vec3 vN;varying vec3 vW;void main(){vUv=uv;vN=normal;vec4 w=modelMatrix*vec4(position,1.);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`,
fragmentShader:`uniform sampler2D sat;uniform vec3 moonDir,fogC,camP;uniform float flash;varying vec2 vUv;varying vec3 vN;varying vec3 vW;
void main(){vec3 c=texture2D(sat,vUv).rgb;float l=dot(c,vec3(.3,.59,.11));
 vec3 base=mix(vec3(l),c,.25);                       // day-for-night: mostly desaturated
 float snow=smoothstep(.55,.8,l);
 float ndl=max(dot(normalize(vN),moonDir),0.);
 vec3 moon=vec3(.55,.66,.95);
 vec3 col=base*(.22+ndl*.35)*moon*1.25 + snow*(.15+ndl*.25)*vec3(.5,.55,.7);
 col+=flash*base*vec3(.8,.85,1.)*(.4+ndl);
 float d=length(vW-camP);float f=1.-exp(-d*0.00006);col=mix(col,fogC,f*.7);
 gl_FragColor=vec4(col,1.);}`}));
scene.add(terr);
// flood water
const wgeo=geo.clone();const wpos=wgeo.attributes.position;
const wcol=new Float32Array(wpos.count);wgeo.setAttribute('foam',new THREE.BufferAttribute(wcol,1));
const WU={t:{value:0},moonDir:U.moonDir,fogC:U.fogC,camP:U.camP,flash:U.flash};
const water=new THREE.Mesh(wgeo,new THREE.ShaderMaterial({uniforms:WU,transparent:true,
vertexShader:`attribute float foam;varying float vF;varying vec3 vW;varying vec2 vUv;void main(){vF=foam;vUv=uv;vec4 w=modelMatrix*vec4(position,1.);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`,
fragmentShader:`uniform float t,flash;uniform vec3 moonDir,fogC,camP;varying float vF;varying vec3 vW;varying vec2 vUv;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
void main(){ if(vF<-.5) discard;
 vec3 V=normalize(camP-vW);
 float r=n(vW.xz*.012+vec2(t*.5,t*.2))*.7+n(vW.xz*.035-vec2(t*1.2,0.))*.3;
 vec3 N=normalize(vec3((r-.5)*.18,1.,(n(vW.xz*.03+t)-.5)*.18));
 vec3 Rf=reflect(-V,N);float spec=pow(max(dot(Rf,moonDir),0.),24.)*.6+pow(1.-max(dot(V,N),0.),4.)*.25;
 vec3 mud=vec3(.05,.06,.07);
 float foam=smoothstep(.62,.95,r)*step(.9,vF)*.8;
 vec3 col=mud+spec*vec3(.7,.78,1.)*.9+foam*vec3(.42,.46,.52)+flash*vec3(.25,.28,.34);
 float d=length(vW-camP);col=mix(col,fogC,(1.-exp(-d*0.00011))*.85);
 gl_FragColor=vec4(col,.96);}`}));
scene.add(water);
function setFlood(front,depth,lakeDrop){ // front: 0..1 along path
 for(let i=0;i<wpos.count;i++){const e=E[i];let y=e-L0-50,f=-1;
  if(LK[i]>.5){y=(L0-lakeDrop)-L0;f=.2;}
  else{const a=AL[i];if(D[i]<45&&a<=front){const dep=depth*(1-a*.45)*Math.min(1,(front-a)*14);const lvl=(e-HAND[i])+dep;if(lvl>e+.5){y=lvl-L0;f=Math.min(1,(front-a)*6)<1?1:.35+.65*Math.max(0,1-(front-a)*3);} }}
  wpos.setY(i,y);wcol[i]=f;}
 wpos.needsUpdate=true;wgeo.attributes.foam.needsUpdate=true;}
// sky
const sky=new THREE.Mesh(new THREE.SphereGeometry(50000,32,16),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,uniforms:{flash:U.flash},
vertexShader:`varying vec3 vD;void main(){vD=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
fragmentShader:`uniform float flash;varying vec3 vD;float h(vec3 p){return fract(sin(dot(p,vec3(12.9898,78.233,37.719)))*43758.5453);}void main(){float y=max(vD.y,0.);vec3 c=mix(vec3(.07,.1,.2),vec3(.012,.02,.05),pow(y,.5));
 vec3 q=floor(vD*900.);float s=step(.9965,h(q))*smoothstep(.02,.2,y)*.9;c+=s;c+=flash*vec3(.35,.38,.5)*(1.-y);gl_FragColor=vec4(c,1.);}`}));
scene.add(sky);
// camera: behind and above the lake, looking down-valley toward Naran
const toW=(r,c,yy)=>new THREE.Vector3((c-(W-1)/2)*M,yy,(r-(Hh-1)/2)*M);
const P=T.path;
window.shot=function(k){ // k 0..1 dolly along valley
 const a=Math.floor(k*(P.length-1)),pa=P[Math.min(P.length-1,a)],pb=P[Math.min(P.length-1,a+60)];
 const A=toW(pa[0],pa[1],0),B=toW(pb[0],pb[1],0);const dir=B.clone().sub(A).normalize();
 const cp=A.clone().sub(dir.clone().multiplyScalar(3600));cp.y=E[pa[0]*W+pa[1]]-L0+3600;
 cam.position.copy(cp);const look=B.clone().add(dir.clone().multiplyScalar(1500));look.y=E[pb[0]*W+pb[1]]-L0-400;cam.lookAt(look);U.camP.value.copy(cp);};
window.setup=async()=>{await new Promise(r=>{const i=setInterval(()=>{if(tex.image){clearInterval(i);r()}},50)});return {dur:12}};
window.renderFrame=function(t,o){o=o||{};const front=o.front!=null?o.front:Math.min(1,t/10);setFlood(front,o.depth||26,o.drop||0);
 WU.t.value=t;U.flash.value=o.flash||0;shot(o.cam!=null?o.cam:.02+front*.25);renderer.render(scene,cam);};
</script></body></html>
